  const top = Math.ceil(m / step) * step;
  const ticks = []; for (let v = 0; v <= top + 1e-9; v += step) ticks.push(Math.round(v * 100) / 100);
  return { max: top, ticks };
}
function tipAttr(html) { return ` data-tip="${attr(html)}"`; }
function ttRow(color, label, value) { return `<div class="tt-row"><span><i style="background:${color}"></i>${h(label)}</span><b>${h(value)}</b></div>`; }
function barRight(x, y, w, hgt, r = 4) {
  if (w <= 0) return '';
  if (w < r + 1) return `<rect x="${x}" y="${y}" width="${w}" height="${hgt}"/>`;
  r = Math.min(r, hgt / 2);
  return `<path d="M${x} ${y}h${w - r}a${r} ${r} 0 0 1 ${r} ${r}v${hgt - 2 * r}a${r} ${r} 0 0 1 -${r} ${r}h-${w - r}z"/>`;
}
function barTop(x, y, w, hgt, r = 4) {
  if (hgt <= 0) return '';
  if (hgt < r + 1) return `<rect x="${x}" y="${y}" width="${w}" height="${hgt}"/>`;
  r = Math.min(r, w / 2);
  return `<path d="M${x} ${y + hgt}v-${hgt - r}a${r} ${r} 0 0 1 ${r} -${r}h${w - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}v${hgt - r}z"/>`;
}
function hatchDef(id, color, bg) {
  return `<pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${bg}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${color}" stroke-width="3"/></pattern>`;
}
function svgOpen(W, H, label) { return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${attr(label || 'chart')}">`; }
function mountChart(el, fn) { if (!el) return; el._draw = fn; fn(el); }

/* ---------- Grouped horizontal bars (Graph 1) ---------- */
function chartHGrouped(el, { rows, series, highlight, label }) {
  const W = Math.max(260, el.clientWidth || 480);
  const id = 'h' + (++_uid);
  const stacked = W < 480;                       // phone: station name sits above its bars
  const labelW = stacked ? 0 : Math.min(170, Math.max(...rows.map(r => tw(r.label, 12.5))) + 14);
  const rightPad = 34, barH = 12, gap = 3, rowPad = 16, labelH = stacked ? 18 : 0;
  const rowH = labelH + series.length * barH + (series.length - 1) * gap + rowPad;
  const top = 4, axisH = 22, H = top + rows.length * rowH + axisH;
  const sc = niceScale(Math.max(...rows.flatMap(r => r.values)), 4);
  const x0 = stacked ? 1 : labelW, x1 = W - rightPad, sx = v => x0 + (x1 - x0) * v / sc.max;
  let s = svgOpen(W, H, label) + `<defs>${hatchDef(id + 'p', C.warn, '#fbe3b0')}</defs>`;
  sc.ticks.forEach(t => {
    const x = sx(t);
    s += `<line x1="${x}" x2="${x}" y1="${top}" y2="${H - axisH}" stroke="${C.grid}"/>`;
    s += `<text x="${x}" y="${H - 6}" text-anchor="middle" font-size="11" fill="${C.muted}">${t}</text>`;
  });
  rows.forEach((r, i) => {
    const y = top + i * rowH + rowPad / 2;
    const dim = highlight && highlight !== 'all' && r.code !== highlight;
    const op = dim ? .32 : 1;
    s += `<g opacity="${op}">`;
    if (stacked) s += `<text x="0" y="${y + 11}" font-size="12.5" fill="${C.strong}" font-weight="${highlight === r.code ? 600 : 500}">${h(r.label)}</text>`;
    else s += `<text x="${x0 - 10}" y="${y + (rowH - rowPad) / 2 + 4}" text-anchor="end" font-size="12.5" fill="${C.strong}" font-weight="${highlight === r.code ? 600 : 500}">${h(r.label)}</text>`;
    series.forEach((se, j) => {
      const by = y + labelH + j * (barH + gap), v = r.values[j], w = Math.max(0, sx(v) - x0);
      const fill = se.hatch ? `url(#${id}p)` : se.color;
      s += `<g fill="${fill}" ${se.hatch ? `stroke="${C.warn}" stroke-width="1"` : ''}>${v > 0 ? barRight(x0, by, Math.max(w, 3), barH) : ''}</g>`;
      s += `<text x="${x0 + w + 6}" y="${by + barH - 2}" font-size="11.5" font-weight="600" fill="${v ? C.strong : C.muted}">${v}</text>`;
    });
    s += `</g>`;
    const tip = `<b>${h(r.label)}</b>` + series.map((se, j) => ttRow(se.color, se.name, r.values[j])).join('') + (r.tipExtra || '');
    s += `<rect x="0" y="${y - rowPad / 2}" width="${W}" height="${rowH}" fill="transparent"${tipAttr(tip)}/>`;
  });
  s += `<line x1="${x0}" x2="${x0}" y1="${top}" y2="${H - axisH}" stroke="${C.axis}"/>`;
  el.innerHTML = s + '</svg>';
}

/* ---------- Priority bars: active + resolved stacked (Graph 2) ---------- */
function chartPriority(el, { bars, label }) {
  const W = Math.max(240, el.clientWidth || 360);
  const tight = (W - 42) / bars.length < 140;
  const H = tight ? 210 : 196;
  const top = 22, bottom = tight ? 54 : 40, left = 34, right = 8;
  const sc = niceScale(Math.max(...bars.map(b => b.active + b.resolved)), 4);
  const plotW = W - left - right, plotH = H - top - bottom;
  const sy = v => top + plotH - plotH * v / sc.max;
  const slot = plotW / bars.length, bw = Math.min(70, slot * .46);
  let s = svgOpen(W, H, label);
  sc.ticks.forEach(t => {
    const y = sy(t);
    s += `<line x1="${left}" x2="${W - right}" y1="${y}" y2="${y}" stroke="${C.grid}"/>`;
    s += `<text x="${left - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="${C.muted}">${t}</text>`;
  });
  bars.forEach((b, i) => {
    const cx = left + slot * i + slot / 2, x = cx - bw / 2;
    const total = b.active + b.resolved;
    const yA = sy(b.active), hA = sy(0) - yA;
    const yT = sy(total), hR = yA - yT - (b.active && b.resolved ? 2 : 0);
    if (b.resolved) s += `<g fill="${b.color}" fill-opacity=".26">${barTop(x, yT, bw, Math.max(1, hR))}</g>`;
    if (b.active) s += `<g fill="${b.color}">${b.resolved ? `<rect x="${x}" y="${yA}" width="${bw}" height="${hA}"/>` : barTop(x, yA, bw, hA)}</g>`;
    s += `<text x="${cx}" y="${yT - 6}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${C.strong}">${total}</text>`;
    s += `<text x="${cx}" y="${H - bottom + 17}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${C.strong}">${h(tight ? b.label.replace(' priority', '') : b.label)}</text>`;
    if (tight) s += `<text x="${cx}" y="${H - bottom + 33}" text-anchor="middle" font-size="11.5" fill="${C.text}">${b.active} active</text><text x="${cx}" y="${H - bottom + 48}" text-anchor="middle" font-size="11.5" fill="${C.text}">${b.resolved} resolved</text>`;
    else s += `<text x="${cx}" y="${H - bottom + 33}" text-anchor="middle" font-size="11.5" fill="${C.text}">${b.active} active · ${b.resolved} resolved</text>`;
    const tip = `<b>${h(b.label)} alerts</b>` + ttRow(b.color, 'Active (not resolved)', b.active) + ttRow('#cfd6d2', 'Resolved', b.resolved) + (b.tipExtra || '');
    s += `<rect x="${cx - slot / 2}" y="${top - 18}" width="${slot}" height="${plotH + 18}" fill="transparent"${tipAttr(tip)}/>`;
  });
  s += `<line x1="${left}" x2="${W - right}" y1="${sy(0)}" y2="${sy(0)}" stroke="${C.axis}"/>`;
  el.innerHTML = s + '</svg>';
}

/* ---------- Horizontal bars in groups (Graph 3) ---------- */
function chartHGroups(el, { groups, label }) {
  const W = Math.max(260, el.clientWidth || 480);
  const allRows = groups.flatMap(g => g.rows);
  const labelW = Math.min(150, Math.max(...allRows.map(r => tw(r.label, 12.5))) + 34);
  const rightPad = 40, barH = 16, rowH = 30, groupH = 24, axisH = 20;
  let H = axisH;
  groups.forEach(g => { H += groupH + g.rows.length * rowH; });
  const sc = niceScale(Math.max(...allRows.map(r => r.value)), 4);
  const x0 = labelW, x1 = W - rightPad, sx = v => x0 + (x1 - x0) * v / sc.max;
  let s = svgOpen(W, H, label);
  let y = 0;
  const gridTop = 0, gridBottom = H - axisH;
  sc.ticks.forEach(t => { const x = sx(t); s += `<line x1="${x}" x2="${x}" y1="${gridTop}" y2="${gridBottom}" stroke="${C.grid}"/><text x="${x}" y="${H - 5}" text-anchor="middle" font-size="11" fill="${C.muted}">${t}</text>`; });
  groups.forEach(g => {
    s += `<text x="0" y="${y + 16}" font-size="11.5" font-weight="600" fill="${C.muted}">${h(g.title)}</text>`;
    s += `<line x1="${tw(g.title, 11.5) + 8}" x2="${x0 - 8}" y1="${y + 12}" y2="${y + 12}" stroke="${C.grid}"/>`;
    y += groupH;
    g.rows.forEach(r => {
      const by = y + (rowH - barH) / 2, w = Math.max(0, sx(r.value) - x0);
      // status glyph so meaning never relies on colour alone
      s += `<rect x="6" y="${by + 3}" width="10" height="10" rx="2" fill="${r.color}"/>`;
      s += `<text x="22" y="${by + barH - 3}" font-size="12.5" font-weight="${r.emph ? 600 : 500}" fill="${C.strong}">${h(r.label)}</text>`;
      s += `<g fill="${r.color}">${r.value > 0 ? barRight(x0, by, Math.max(w, 3), barH) : ''}</g>`;
      s += `<text x="${x0 + w + 6}" y="${by + barH - 3}" font-size="12" font-weight="600" fill="${r.value ? C.strong : C.muted}">${r.value}</text>`;
      s += `<rect x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent"${tipAttr(r.tip || `<b>${h(r.label)}</b><br>${r.value}`)}/>`;
      y += rowH;
    });
  });
  s += `<line x1="${x0}" x2="${x0}" y1="${gridTop}" y2="${gridBottom}" stroke="${C.axis}"/>`;
  el.innerHTML = s + '</svg>';
}

/* ---------- Completion 100% bars with target (Graph 4) ---------- */
function chartCompletion(el, { rows, target, highlight, label }) {
  const W = Math.max(260, el.clientWidth || 480);
  const stacked = W < 480;                       // phone: name and percentage above each bar
  const labelW = stacked ? 0 : Math.min(170, Math.max(...rows.map(r => tw(r.label, 12.5))) + 14);
  const rightW = stacked ? 2 : 172, barH = 14, labelH = stacked ? 18 : 0, rowH = labelH + (stacked ? 30 : 34), top = 20, axisH = 18;
  const H = top + rows.length * rowH + axisH;
  const x0 = stacked ? 0 : labelW, x1 = W - rightW, sx = p => x0 + (x1 - x0) * p / 100;
  let s = svgOpen(W, H, label);
  [0, 25, 50, 75, 100].forEach(t => { const x = sx(t); s += `<line x1="${x}" x2="${x}" y1="${top}" y2="${H - axisH}" stroke="${C.grid}"/><text x="${clamp(x, 12, W - 14)}" y="${H - 4}" text-anchor="middle" font-size="11" fill="${C.muted}">${t}%</text>`; });
  rows.forEach((r, i) => {
    const rowTop = top + i * rowH;
    const y = rowTop + labelH + (rowH - labelH - barH) / 2;
    const dim = highlight && highlight !== 'all' && r.code !== highlight;
    const below = r.total > 0 && r.pct < target;
    const wDone = sx(r.pct) - x0, wRest = x1 - sx(r.pct);
    const pctTxt = r.total ? r.pct.toFixed(1) + '%' : '—';
    s += `<g opacity="${dim ? .32 : 1}">`;
    if (stacked) {
      s += `<text x="0" y="${rowTop + 14}" font-size="12.5" fill="${C.strong}" font-weight="${highlight === r.code ? 600 : 500}">${h(r.label)}</text>`;
      s += `<text x="${W - 2}" y="${rowTop + 14}" text-anchor="end" font-size="12.5" font-weight="600" fill="${below ? '#9b1c1c' : C.strong}">${below ? '▲ ' : ''}${pctTxt}</text>`;
    } else {
      s += `<text x="${x0 - 10}" y="${y + barH - 3}" text-anchor="end" font-size="12.5" fill="${C.strong}" font-weight="${highlight === r.code ? 600 : 500}">${h(r.label)}</text>`;
    }
    if (r.total === 0) {
      s += `<rect x="${x0}" y="${y}" width="${x1 - x0}" height="${barH}" rx="4" fill="${C.track}"/><text x="${x0 + 8}" y="${y + barH - 3}" font-size="11" fill="${C.muted}">No travelers in period</text>`;
    } else {
      if (wDone > 0) s += `<rect x="${x0}" y="${y}" width="${Math.max(0, wDone - (wRest > 0 ? 1 : 0))}" height="${barH}" rx="4" fill="${below ? C.warn : C.good}"/>`;
      if (wRest > 1) s += `<rect x="${x0 + wDone + 1}" y="${y}" width="${wRest - 1}" height="${barH}" rx="4" fill="${C.track}"/>`;
    }
    if (!stacked) {
      const tx = x1 + 10;
      s += `<text x="${tx}" y="${y + barH - 3}" font-size="12.5" font-weight="600" fill="${C.strong}">${pctTxt}</text>`;
      if (below) {
        s += `<path transform="translate(${tx + 52} ${y})" d="M7 1.5 13 12.5H1z" fill="${C.crit}"/><text x="${tx + 52 + 7}" y="${y + 10.5}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">!</text>`;
        s += `<text x="${tx + 70}" y="${y + barH - 3}" font-size="11.5" font-weight="600" fill="#9b1c1c">Needs attention</text>`;
      }
    }
    s += `</g>`;
    const tip = `<b>${h(r.label)}</b>` + ttRow(below ? C.warn : C.good, 'Screening completed', `${r.done} (${r.total ? r.pct.toFixed(1) : 0}%)`) + ttRow(C.track, 'Incomplete record', r.incomplete) + ttRow(C.track, 'Not yet screened', r.notScreened) + `<div class="tt-row"><span>Registered</span><b>${r.total}</b></div>` + (below ? `<div style="margin-top:4px;color:#ffb4b4">Below ${target}% target — needs attention</div>` : '');
    s += `<rect x="0" y="${rowTop}" width="${W}" height="${rowH}" fill="transparent"${tipAttr(tip)}/>`;
  });
  const xt = sx(target);
  if (stacked) rows.forEach((r, i) => { const yb = top + i * rowH + labelH + (rowH - labelH - barH) / 2; s += `<line x1="${xt}" x2="${xt}" y1="${yb - 4}" y2="${yb + barH + 4}" stroke="${C.strong}" stroke-width="1.5" stroke-dasharray="3 2"/>`; });
  else s += `<line x1="${xt}" x2="${xt}" y1="${top - 6}" y2="${H - axisH}" stroke="${C.strong}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  s += `<text x="${Math.min(xt, W - 34)}" y="${top - 9}" text-anchor="middle" font-size="11" font-weight="600" fill="${C.strong}">Target ${target}%</text>`;
  el.innerHTML = s + '</svg>';
}

/* ---------- Line chart (trend) ---------- */
function chartLine(el, { points, series, label, height = 230 }) {
  const W = Math.max(260, el.clientWidth || 600), H = height;
  const narrow = W < 560;
  const top = 18, bottom = 30, left = 38, right = W < 420 ? 86 : 112;
  const sc = niceScale(Math.max(...points.flatMap(p => p.values)), 4);
  const plotW = W - left - right, plotH = H - top - bottom;
  const sx = i => left + (points.length === 1 ? plotW / 2 : plotW * i / (points.length - 1));
  const sy = v => top + plotH - plotH * v / sc.max;
  const id = 'l' + (++_uid);
  let s = svgOpen(W, H, label);
  s += `<defs><linearGradient id="${id}g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${series[0].color}" stop-opacity=".16"/><stop offset="1" stop-color="${series[0].color}" stop-opacity="0"/></linearGradient></defs>`;
  sc.ticks.forEach(t => { const y = sy(t); s += `<line x1="${left}" x2="${W - right}" y1="${y}" y2="${y}" stroke="${C.grid}"/><text x="${left - 7}" y="${y + 4}" text-anchor="end" font-size="11" fill="${C.muted}">${t}</text>`; });
  points.forEach((p, i) => { s += `<text x="${sx(i)}" y="${H - 9}" text-anchor="middle" font-size="11.5" fill="${p.partial ? C.text : C.muted}" font-weight="${p.partial ? 600 : 400}">${h(narrow ? (p.partial ? 'Today' : p.label.split(' ').pop()) : p.label)}</text>`; });
  // area under first series
  const p0 = points.map((p, i) => `${sx(i)},${sy(p.values[0])}`).join(' ');
  s += `<polygon points="${sx(0)},${sy(0)} ${p0} ${sx(points.length - 1)},${sy(0)}" fill="url(#${id}g)"/>`;
  series.forEach((se, j) => {
    const pts = points.map((p, i) => `${sx(i)},${sy(p.values[j])}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${se.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
    points.forEach((p, i) => { s += `<circle cx="${sx(i)}" cy="${sy(p.values[j])}" r="4" fill="${p.partial ? '#fff' : se.color}" stroke="${p.partial ? se.color : '#fff'}" stroke-width="2"/>`; });
    // direct label at the end
    const last = points[points.length - 1].values[j];
    const ly = sy(last) + (j === 0 ? -8 : 14);
    s += `<text x="${sx(points.length - 1) + 10}" y="${ly + 4}" font-size="12" fill="${C.strong}" font-weight="600">${last}<tspan font-weight="400" fill="${C.text}"> ${h(se.short || se.name)}</tspan></text>`;
  });
  s += `<line x1="${left}" x2="${W - right}" y1="${sy(0)}" y2="${sy(0)}" stroke="${C.axis}"/>`;
  // hover columns
  const colW = points.length > 1 ? plotW / (points.length - 1) : plotW;
  points.forEach((p, i) => {
    const tip = `<b>${h(p.full || p.label)}${p.partial ? ' (so far)' : ''}</b>` + series.map((se, j) => ttRow(se.color, se.name, p.values[j])).join('') + (p.tipExtra || '');
    s += `<rect class="hovercol" x="${sx(i) - colW / 2}" y="${top}" width="${colW}" height="${plotH}" fill="transparent"${tipAttr(tip)}/>`;
  });
  el.innerHTML = s + '</svg>';
}

/* ---------- Small donut-free stacked strip (station outcome mix) ---------- */
function stripHTML(parts) {
  const total = parts.reduce((a, p) => a + p.value, 0) || 1;
  return `<div style="display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:#fff">${parts.filter(p => p.value > 0).map(p => `<span style="flex:${p.value} 0 0;background:${p.color}"${tipAttr(`<b>${h(p.label)}</b><br>${p.value} (${pct(p.value, total)})`)}></span>`).join('')}</div>`;
}

/* ============================================================
   Ministry Overview charts — gauges, donuts, columns, area, heatmap
   ============================================================ */
const STATION_COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#6250d6', '#008300', '#8a948f'];
function polar(cx, cy, r, a) { return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
function arcPath(cx, cy, r, a0, a1) {
  const [x0, y0] = polar(cx, cy, r, a0), [x1, y1] = polar(cx, cy, r, a1);
  return `M${x0} ${y0}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1} ${y1}`;
}
/* semicircle gauge with target tick */
function chartGauge(el, { value, target, good = 'high', label }) {
  const W = Math.max(180, Math.min(el.clientWidth || 220, 260)), H = Math.round(W * .62);
  const cx = W / 2, cy = H - 14, r = W / 2 - 16, sw = Math.max(14, W * .085);
  const v = clamp(value || 0, 0, 100), ok = good === 'high' ? v >= target : v <= target;
  const color = ok ? C.good : v >= target - 10 ? C.warn : C.crit;
  const a0 = Math.PI, aV = Math.PI + Math.PI * v / 100, aT = Math.PI + Math.PI * target / 100;
  const [tx0, ty0] = polar(cx, cy, r - sw / 2 - 4, aT), [tx1, ty1] = polar(cx, cy, r + sw / 2 + 4, aT);
  let s = svgOpen(W, H, label);
  s += `<path d="${arcPath(cx, cy, r, a0, 2 * Math.PI)}" fill="none" stroke="${C.track}" stroke-width="${sw}" stroke-linecap="round"/>`;
  if (v > 0) s += `<path d="${arcPath(cx, cy, r, a0, Math.max(aV, a0 + .02))}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
  s += `<line x1="${tx0}" y1="${ty0}" x2="${tx1}" y2="${ty1}" stroke="${C.strong}" stroke-width="2.5"/>`;
  s += `<text x="${cx}" y="${cy - 10}" text-anchor="middle" font-size="${Math.round(W * .15)}" font-weight="600" fill="${C.strong}">${v.toFixed(1)}%</text>`;
  s += `<text x="${cx - r}" y="${cy + 13}" text-anchor="middle" font-size="10.5" fill="${C.muted}">0</text><text x="${cx + r}" y="${cy + 13}" text-anchor="middle" font-size="10.5" fill="${C.muted}">100</text>`;
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"${tipAttr(`<b>${h(label)}</b><br>${v.toFixed(1)}% · target ${target}%`)}/>`;
  el.innerHTML = s + '</svg>';
}
/* tiny sparkline (string) */
function sparkSVG(values, color = C.green, w = 120, hgt = 34) {
  const max = Math.max(1, ...values), n = values.length;
  const pts = values.map((v, i) => `${(i / Math.max(1, n - 1)) * (w - 4) + 2},${hgt - 3 - (v / max) * (hgt - 8)}`).join(' ');
  const last = pts.split(' ').pop().split(',');
  return `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" aria-hidden="true"><polyline points="2,${hgt - 3} ${pts} ${w - 2},${hgt - 3}" fill="${color}" fill-opacity=".1" stroke="none"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/></svg>`;
}
/* donut with centre total */
function chartDonut(el, { parts, centerValue, centerLabel, label }) {
  const W = Math.min(220, Math.max(160, el.clientWidth || 200)), H = W;
  const cx = W / 2, cy = H / 2, r = W / 2 - 14, sw = Math.max(18, W * .13);
  const total = parts.reduce((a, p) => a + p.value, 0);
  let s = svgOpen(W, H, label);
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.track}" stroke-width="${sw}"/>`;
  let a = -Math.PI / 2;
  const gap = parts.filter(p => p.value).length > 1 ? .025 : 0;
  parts.forEach(p => {
    if (!p.value || !total) return;
    const da = 2 * Math.PI * p.value / total;
    const a1 = a + da;
    const path = da >= 2 * Math.PI - .001 ? `M${cx} ${cy - r}a${r} ${r} 0 1 1 -.01 0` : arcPath(cx, cy, r, a + gap / 2, Math.max(a + gap / 2 + .001, a1 - gap / 2));
    s += `<path d="${path}" fill="none" stroke="${p.color}" stroke-width="${sw}"${tipAttr(`<b>${h(p.label)}</b><br>${n0(p.value)} (${pct(p.value, total)})`)}/>`;
    a = a1;
  });
  s += `<text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="${Math.round(W * .15)}" font-weight="600" fill="${C.strong}">${centerValue}</text>`;
  s += `<text x="${cx}" y="${cy + 22}" text-anchor="middle" font-size="11.5" fill="${C.muted}">${h(centerLabel)}</text>`;
  el.innerHTML = s + '</svg>';
}
function donutLegend(parts) {
  const total = parts.reduce((a, p) => a + p.value, 0);
  return `<ul class="donut-legend">${parts.map(p => `<li><i style="background:${p.color}"></i><span>${h(p.label)}</span><b>${n0(p.value)}</b><em>${total ? pct(p.value, total) : '—'}</em></li>`).join('')}</ul>`;
}
/* stacked columns (e.g. travelers by station per day) */
function chartStackedCols(el, { labels, series, label, partialLast }) {
  const W = Math.max(280, el.clientWidth || 600), H = 250;
  const top = 16, bottom = 28, left = 36, right = 8;
  const totals = labels.map((_, i) => series.reduce((a, s) => a + s.values[i], 0));
  const sc = niceScale(Math.max(...totals), 4);
  const plotW = W - left - right, plotH = H - top - bottom;
  const slot = plotW / labels.length, bw = Math.max(4, Math.min(36, slot * .66));
  const sy = v => top + plotH - plotH * v / sc.max;
  const every = Math.ceil(labels.length / Math.max(1, Math.floor(plotW / 46)));
  let s = svgOpen(W, H, label);
  sc.ticks.forEach(t => { const y = sy(t); s += `<line x1="${left}" x2="${W - right}" y1="${y}" y2="${y}" stroke="${C.grid}"/><text x="${left - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="${C.muted}">${t}</text>`; });
  labels.forEach((l, i) => {
    const x = left + slot * i + (slot - bw) / 2;
    let acc = 0;
    series.forEach((se, j) => {
      const v = se.values[i]; if (!v) return;
      const y1 = sy(acc + v), y0 = sy(acc);
      const isTop = series.slice(j + 1).every(s2 => !s2.values[i]);
      s += `<g fill="${se.color}" ${partialLast && i === labels.length - 1 ? 'fill-opacity=".65"' : ''}>${isTop ? barTop(x, y1, bw, Math.max(1, y0 - y1 - (acc ? 1 : 0)), 3) : `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(1, y0 - y1 - (acc ? 1 : 0))}"/>`}</g>`;
      acc += v;
    });
    if (i % every === 0 || i === labels.length - 1) s += `<text x="${x + bw / 2}" y="${H - 9}" text-anchor="middle" font-size="11" fill="${C.muted}">${h(l)}</text>`;
    const tip = `<b>${h(l)}${partialLast && i === labels.length - 1 ? ' (so far)' : ''}</b>` + series.filter(se => se.values[i]).map(se => ttRow(se.color, se.name, se.values[i])).join('') + `<div class="tt-row"><span>Total</span><b>${totals[i]}</b></div>`;
    s += `<rect x="${left + slot * i}" y="${top}" width="${slot}" height="${plotH}" fill="transparent"${tipAttr(tip)}/>`;
  });
  s += `<line x1="${left}" x2="${W - right}" y1="${sy(0)}" y2="${sy(0)}" stroke="${C.axis}"/>`;
  el.innerHTML = s + '</svg>';
}
/* area chart for case curves */
function chartArea(el, { labels, series, label }) {
  const W = Math.max(280, el.clientWidth || 600), H = 230;
  const top = 16, bottom = 28, left = 30, right = 10;
  const sc = niceScale(Math.max(2, ...series.flatMap(s => s.values)), 4);
  const plotW = W - left - right, plotH = H - top - bottom, n = labels.length;
  const sx = i => left + (n === 1 ? plotW / 2 : plotW * i / (n - 1)), sy = v => top + plotH - plotH * v / sc.max;
  const every = Math.ceil(n / Math.max(1, Math.floor(plotW / 46)));
  let s = svgOpen(W, H, label);
  sc.ticks.forEach(t => { const y = sy(t); s += `<line x1="${left}" x2="${W - right}" y1="${y}" y2="${y}" stroke="${C.grid}"/><text x="${left - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="${C.muted}">${t}</text>`; });
  series.forEach(se => {
    const pts = se.values.map((v, i) => `${sx(i)},${sy(v)}`).join(' ');
    s += `<polygon points="${sx(0)},${sy(0)} ${pts} ${sx(n - 1)},${sy(0)}" fill="${se.color}" fill-opacity=".14"/>`;
    s += `<polyline points="${pts}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round"/>`;
    se.values.forEach((v, i) => { if (v) s += `<circle cx="${sx(i)}" cy="${sy(v)}" r="3.5" fill="${se.color}" stroke="#fff" stroke-width="1.5"/>`; });
  });
  labels.forEach((l, i) => { if (i % every === 0 || i === n - 1) s += `<text x="${sx(i)}" y="${H - 9}" text-anchor="middle" font-size="11" fill="${C.muted}">${h(l)}</text>`; });
  s += `<line x1="${left}" x2="${W - right}" y1="${sy(0)}" y2="${sy(0)}" stroke="${C.axis}"/>`;
  const colW = n > 1 ? plotW / (n - 1) : plotW;
  labels.forEach((l, i) => { s += `<rect x="${sx(i) - colW / 2}" y="${top}" width="${colW}" height="${plotH}" fill="transparent"${tipAttr(`<b>${h(l)}</b>` + series.map(se => ttRow(se.color, se.name, se.values[i])).join(''))}/>`; });
  el.innerHTML = s + '</svg>';
}
/* heatmap as HTML grid (sequential green, lighter = lower) */
function heatHTML(rows, cols, cell) {
  const shade = p => p === null ? '#f2f4f3' : p >= 95 ? '#0d5a33' : p >= 90 ? '#188a4f' : p >= 85 ? '#6fbf8f' : p >= 75 ? '#f0c060' : '#e07a5f';
  const ink = p => p !== null && (p >= 90) ? '#fff' : '#18221e';
  return `<div class="heat"><table><thead><tr><th></th>${cols.map(c => `<th>${h(c.label)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr><th>${h(r.label)}</th>${cols.map(c => { const v = cell(r, c); return `<td style="background:${shade(v.p)};color:${ink(v.p)}"${tipAttr(`<b>${h(r.label)} · ${h(c.full)}</b><br>${v.p === null ? 'No travelers' : `${v.p.toFixed(0)}% screened (${v.done}/${v.total})`}`)}>${v.p === null ? '' : Math.round(v.p)}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ---------- Router ----------
   'hash' mode keeps the page in the address bar (normal browser, file://).
   'memory' mode is used when the URL cannot be changed — e.g. inside an embedded
   preview (about:srcdoc) — so navigation never touches the URL there. */
const ROUTER = { mode: 'hash', current: '#/' + HOME };
function detectRouterMode() {
  let start = '#/' + HOME;
  try { if (/^#\/./.test(location.hash)) start = location.hash; } catch (e) { /* ignore */ }
  ROUTER.current = start;
  try {
    if (/^about:/.test(String(location.href))) throw new Error('embedded');
    history.replaceState(history.state, '', start);
    ROUTER.mode = 'hash';
  } catch (e) { ROUTER.mode = 'memory'; }
}
function currentHash() {
  if (ROUTER.mode === 'hash') { try { return location.hash || '#/' + HOME; } catch (e) { return ROUTER.current; } }
  return ROUTER.current;
}
function goHash(hash) {
  if (ROUTER.mode === 'hash') {
    try { if (location.hash === hash) render(); else location.hash = hash; return; } catch (e) { ROUTER.mode = 'memory'; }
  }
  ROUTER.current = hash; render();
}
// change the remembered location without re-rendering (e.g. after selecting a traveler)
function replaceHash(hash) {
  ROUTER.current = hash;
  if (ROUTER.mode === 'hash') { try { history.replaceState(history.state, '', hash); } catch (e) { ROUTER.mode = 'memory'; } }
}
function isEmbedded() { return ROUTER.mode === 'memory'; }
function parseHash() {
  const raw = currentHash().replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  const page = PAGES[path] ? path : HOME;
  return { page, params: new URLSearchParams(qs || '') };
}
function go(page, params) {
  const qs = params ? '?' + new URLSearchParams(params).toString() : '';
  goHash(`#/${page}${qs}`);
}
let CURRENT = { page: null, params: null };
function render() {
  const { page, params } = parseHash();
  const def = PAGES[page];
  const changedPage = CURRENT.page !== page;
  CURRENT = { page, params };
  ROUTER.current = currentHash();
  closeMenus(); closeModal(); if (changedPage) closeDrawer();
  document.body.classList.remove('nav-open');
  renderSidebar(page === 'register' ? 'records' : page);
  document.getElementById('crumbs').textContent = `${APP.ministry} / ${APP.short}`;
  document.getElementById('page-title').textContent = def.title;
  document.title = `${def.title} — ${APP.short}`;
  const el = document.getElementById('page');
  el.innerHTML = def.render(params);
  labelTables(el);
  if (def.mount) def.mount(params);
  if (changedPage) window.scrollTo(0, 0);
}
function refresh() { const y = window.scrollY; render(); window.scrollTo(0, y); }

/* ---------- Searchable traveler dropdown ---------- */
function comboHTML(id, ref, placeholder = 'Search by name, registration reference or document number') {
  const t = ref ? IDX.byRef.get(ref) : null;
  return `<div class="combo" id="${id}" data-value="${attr(ref || '')}">${icon('search')}<input class="input combo-input" type="text" autocomplete="off" placeholder="${attr(placeholder)}" value="${attr(t ? `${t.name} — ${t.ref}` : '')}" role="combobox" aria-expanded="false" aria-autocomplete="list"><div class="combo-list" role="listbox"></div></div>`;
}
function mountCombo(id, onSelect) {
  const box = document.getElementById(id); if (!box) return;
  const input = box.querySelector('input'), list = box.querySelector('.combo-list');
  let items = [], active = 0;
  const sorted = DB.travelers.slice().sort((a, b) => b.regAt - a.regAt);
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    const cur = box.dataset.value;
    const curT = cur ? IDX.byRef.get(cur) : null;
    const showAll = !q || (curT && input.value === `${curT.name} — ${curT.ref}`);
    items = (showAll ? sorted : sorted.filter(t => t.name.toLowerCase().includes(q) || t.ref.toLowerCase().includes(q) || (t.docNumber || '').toLowerCase().includes(q))).slice(0, 40);
    active = 0;
    list.innerHTML = items.length ? (showAll ? `<div class="small muted" style="padding:6px 10px">Most recent registrations — type to search all ${n0(DB.travelers.length)}</div>` : '') + items.map((t, i) => `<div class="combo-opt ${i === active ? 'active' : ''}" data-i="${i}" role="option"><strong>${h(t.name)}</strong><span class="mono">${h(t.ref)}</span><span class="meta">${h(t.nationality)} · ${h(stationName(t.station))} · ${t.direction} · ${fmtDT(t.regAt)} · ${screeningStatus(t.ref).text}</span></div>`).join('') : `<div class="empty" style="padding:16px"><strong>No traveler found</strong>Check the spelling or register the traveler first.</div>`;
  };
  const choose = i => { const t = items[i]; if (!t) return; box.dataset.value = t.ref; input.value = `${t.name} — ${t.ref}`; box.classList.remove('open'); input.setAttribute('aria-expanded', 'false'); box.closest('.f')?.classList.remove('invalid'); onSelect(t); };
  input.addEventListener('focus', () => { closeCombos(box); draw(); box.classList.add('open'); input.setAttribute('aria-expanded', 'true'); input.select(); });
  input.addEventListener('input', () => { draw(); box.classList.add('open'); });
  input.addEventListener('keydown', e => {
    const opts = list.querySelectorAll('.combo-opt');
    if (e.key === 'ArrowDown') { active = Math.min(items.length - 1, active + 1); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { active = Math.max(0, active - 1); e.preventDefault(); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(active); return; }
    else if (e.key === 'Escape') { box.classList.remove('open'); return; }
    else return;
    opts.forEach((o, i) => o.classList.toggle('active', i === active));
    opts[active]?.scrollIntoView({ block: 'nearest' });
  });
  list.addEventListener('mousedown', e => { const o = e.target.closest('.combo-opt'); if (o) { e.preventDefault(); choose(+o.dataset.i); } });
}

}

/* ---------- Global listeners ---------- */
function initGlobal() {
  document.addEventListener('click', e => {
    const link = e.target.closest('a[href^="#/"]');
    if (link && !e.defaultPrevented && !e.metaKey && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); closeMenus(); closeCombos(); goHash(link.getAttribute('href')); return; }
    if (!e.target.closest('.actions')) closeMenus();
    if (!e.target.closest('.combo')) closeCombos();
    const el = e.target.closest('[data-act]');
    if (el && !el.disabled && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el, e); }
  });
  document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && ACT[el.dataset.change]) ACT[el.dataset.change](el, e); });
  document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && ACT[el.dataset.input]) ACT[el.dataset.input](el, e); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.body.classList.remove('nav-open'); closeModal(); if (closeDrawer() && CURRENT.page === 'records') replaceHash('#/records'); closeMenus(); } });
  document.getElementById('nav').addEventListener('click', e => { if (e.target.closest('a')) document.body.classList.remove('nav-open'); });
  document.getElementById('scrim').addEventListener('click', () => { if (document.body.classList.contains('nav-open')) { document.body.classList.remove('nav-open'); return; } closeModal(); if (closeDrawer() && CURRENT.page === 'records') replaceHash('#/records'); });
  // chart tooltips
  const tt = document.getElementById('tooltip');
  document.addEventListener('mousemove', e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tt.style.display = 'none'; return; }
    tt.innerHTML = t.getAttribute('data-tip'); tt.style.display = 'block';
    const r = tt.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
    tt.style.left = x + 'px'; tt.style.top = y + 'px';
  });
  document.addEventListener('click', e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) return;
    tt.innerHTML = t.getAttribute('data-tip'); tt.style.display = 'block';
    const r = tt.getBoundingClientRect();
    tt.style.left = clamp(e.clientX - r.width / 2, 8, innerWidth - r.width - 8) + 'px';
    tt.style.top = (e.clientY - r.height - 14 > 8 ? e.clientY - r.height - 14 : e.clientY + 16) + 'px';
  });
  document.addEventListener('scroll', () => { tt.style.display = 'none'; }, true);
  let rt, lastBand = innerWidth <= 1180;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const band = innerWidth <= 1180; if (band !== lastBand && CURRENT.page === 'alerts') { lastBand = band; closeDrawer(); refresh(); } else { lastBand = band; redrawCharts(); } if (innerWidth > 760) document.body.classList.remove('nav-open'); }, 140); });
  window.addEventListener('hashchange', () => { if (ROUTER.mode === 'hash') render(); });
}

const SL_OUTLINE = [[43.25,11.47],[43.47,11.37],[43.75,11.05],[44.1,10.55],[44.43,10.4],[45.03,10.44],[45.6,10.62],[46.2,10.75],[46.9,10.95],[47.5,11.17],[48.2,11.22],[48.95,11.28],[49.0,10.4],[48.9,9.5],[48.0,8.0],[47.0,8.0],[46.0,8.0],[45.0,8.45],[44.3,9.15],[43.95,9.38],[43.6,9.56],[43.2,9.82],[42.95,10.3],[42.85,10.95],[43.1,11.2]];

function slMapXY(lon, lat) { return [((lon - 42.4) / (49.3 - 42.4)) * 700, ((11.75 - lat) / (11.75 - 7.8)) * 400]; }
function labMapHTML(period, stationFilter) {
  const rows = stationBreakdown(period).map(({ station: st, m }) => {
    const neg = m.tests.filter(t => t.status === 'Completed' && t.result === 'Negative').length;
    return { st, tests: m.tests.length, conf: m.confirmed.length, pre: m.prelim.length, neg, pend: m.pendingAll, xy: STATION_COORDS[st.code] || (st.lon != null ? [st.lon, st.lat] : null) };
  });
  const maxT = Math.max(1, ...rows.map(r => r.tests));
  const outline = SL_OUTLINE.map(([lo, la]) => slMapXY(lo, la).map(v => v.toFixed(1)).join(',')).join(' ');
  const towns = SL_TOWNS.map(([n, lo, la, pos]) => { const [x, y] = slMapXY(lo, la); return `<g class="lm-town"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"/><text x="${(pos === 'l' ? x - 6 : x + 6).toFixed(1)}" y="${(pos === 'l' ? y - 6 : y + 4).toFixed(1)}" text-anchor="${pos === 'l' ? 'end' : 'start'}">${h(n)}</text></g>`; }).join('');
  const markers = rows.filter(r => r.xy).map(r => {
    const [x, y] = slMapXY(r.xy[0], r.xy[1]);
    const rad = 11 + Math.sqrt(r.tests / maxT) * 13;
    const side = { HGA: 't', WAJ: 'b', BBP: 't' }[r.st.code] || 't';
    const lx = side === 'r' ? x + rad + 8 : side === 'l' ? x - rad - 8 : x, anchor = side === 'r' ? 'start' : side === 'l' ? 'end' : 'middle';
    const ny = side === 't' ? y - rad - 22 : side === 'b' ? y + rad + 16 : y - 3, vy = side === 't' ? y - rad - 7 : side === 'b' ? y + rad + 31 : y + 13;
    const tone = r.conf ? C.crit : r.pre ? C.warn : C.good;
    const dim = stationFilter && stationFilter !== 'all' && stationFilter !== r.st.code ? ' opacity=".35"' : '';
    return `<g class="lm-st" data-act="go" data-page="stations" data-params='${JSON.stringify({ station: r.st.code })}'${dim}><title>${h(r.st.name)}: ${r.tests} tests · ${r.conf} confirmed · ${r.pre} preliminary · ${r.neg} negative · ${r.pend} awaiting</title>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="${tone}" fill-opacity=".18" stroke="${tone}" stroke-width="2"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${tone}"/>
      <text class="lm-n" x="${lx.toFixed(1)}" y="${ny.toFixed(1)}" text-anchor="${anchor}">${h(r.st.name)}</text>
      <text class="lm-v" x="${lx.toFixed(1)}" y="${vy.toFixed(1)}" text-anchor="${anchor}">${r.tests} tests${r.conf ? ` · ${r.conf} confirmed` : ''}</text></g>`;
  }).join('');
  const list = rows.map(r => `<button class="lm-row" data-act="go" data-page="stations" data-params='${JSON.stringify({ station: r.st.code })}'>
      <span class="lm-dot" style="background:${r.conf ? C.crit : r.pre ? C.warn : C.good}"></span>
      <span class="lm-name"><strong>${h(r.st.name)}</strong><small>${n0(r.tests)} tests requested</small></span>
      <span class="lm-nums"><b style="color:var(--crit-ink)">${r.conf}</b><small>confirmed</small></span>
      <span class="lm-nums"><b style="color:var(--warn-ink)">${r.pre}</b><small>preliminary</small></span>
      <span class="lm-nums"><b style="color:var(--good-ink)">${r.neg}</b><small>negative</small></span>
      <span class="lm-nums"><b>${r.pend}</b><small>awaiting</small></span></button>`).join('');
  return `<div class="card lab-map"><div class="card-h"><div><h3>Laboratory results by border station</h3><p>Map of Somaliland · ${h(PERIODS[period] || periodLabel(period))} · circle size shows the number of tests</p></div></div>
    <div class="card-b lm-body">
      <svg class="lm-svg" viewBox="0 0 700 400" role="img" aria-label="Map of Somaliland showing laboratory results at each border station">
        <rect x="0" y="0" width="700" height="400" class="lm-sea"/>
        <polygon points="${outline}" class="lm-land"/>
        <text x="560" y="40" class="lm-label">Gulf of Aden</text><text x="40" y="380" class="lm-label">Ethiopia</text><text x="18" y="70" class="lm-label">Djibouti</text>
        ${towns}${markers}
      </svg>
      <div class="lm-side">
        <div class="legend" style="margin-bottom:10px"><span><i style="background:${C.crit}"></i>Confirmed positive</span><span><i style="background:${C.warn}"></i>Preliminary only</span><span><i style="background:${C.good}"></i>No positives</span></div>
        <div class="lm-list">${list}</div>
        <p class="small muted" style="margin:10px 0 0">Schematic map — boundaries are approximate. Select a station to open its details.</p>
      </div>
    </div></div>`;
}
function ministryData(f) {
  const now = Date.now();
  const m = computeMetrics(f.period, f.station, now);
  const sMatch = c => f.station === 'all' || c === f.station;
  const fin = m.tests.filter(t => (t.status === 'Completed' || t.status === 'Invalid') && t.resultAt && t.collectedAt);
  const onTime = fin.filter(t => (t.resultAt - t.collectedAt) / HOUR <= TEST_TYPES[t.type].limitH).length;
  const resolved = m.alerts.filter(a => a.status === 'Resolved').length;
  const suspected = m.screenings.filter(s => s.outcome === 'referred');
  const affected = m.travelers.filter(t => AFFECTED_COUNTRIES.includes(t.originCountry));
  const days = f.period === '30d' ? 30 : 7;
  const t0 = sod(now);
  const dayKeys = Array.from({ length: days }, (_, i) => addDays(t0, -(days - 1 - i)));
  const inDay = (ts, d) => ts >= d && ts < addDays(d, 1);
  const spark = fn => Array.from({ length: 14 }, (_, i) => fn(addDays(t0, -(13 - i))));
  return {
    m, fin, onTime, resolved, suspected, affected, dayKeys, inDay,
    sparkTrav: spark(d => DB.travelers.filter(t => sMatch(t.station) && inDay(t.regAt, d)).length),
    sparkSusp: spark(d => DB.screenings.filter(s => sMatch(s.station) && s.outcome === 'referred' && inDay(s.at, d)).length),
    sparkConf: spark(d => DB.tests.filter(t => sMatch(t.station) && isConfirmedPositive(t) && inDay(t.resultAt, d)).length),
    sparkAff: spark(d => DB.travelers.filter(t => sMatch(t.station) && AFFECTED_COUNTRIES.includes(t.originCountry) && inDay(t.regAt, d)).length),
    sparkUrg: spark(d => DB.alerts.filter(a => sMatch(a.station) && a.priority === 'urgent' && inDay(a.createdAt, d)).length),
  };
}
function confirmedByCountryHTML(m) {
  const byC = {};

    const o = byC[c] || (byC[c] = { n: 0, st: new Set(), nat: new Set(), last: 0, refs: [] });
    o.n++; o.st.add(stationName(t.station)); if (tr) { o.nat.add(tr.nationality); o.refs.push(tr.ref); } o.last = Math.max(o.last, t.resultAt || 0); });
  const rows = Object.entries(byC).sort((a, b) => b[1].n - a[1].n || b[1].last - a[1].last);
  const max = Math.max(1, ...rows.map(r => r[1].n));

        <td><div class="cell-bar"><div class="track"><i style="width:${(o.n / max * 100).toFixed(0)}%;background:var(--crit)"></i></div><b class="nowrap">${pct(o.n, m.confirmed.length)}</b></div></td>
        <td class="small">${h([...o.st].join(', '))}</td><td class="small hide-md">${h([...o.nat].join(', '))}</td><td class="small nowrap">${o.last ? fmtSDT(o.last) : '—'}</td></tr>`).join('')}

}

function mergeTransportRef(d, stCode) {

function filteredRegisterTravelers() {

    const lt = latestTest(t.ref);

    if (f.res !== 'all') {
      if (!lt) return false;
      const code = isUnfinished(lt) ? 'pending' : isConfirmedPositive(lt) ? 'confirmed' : isPreliminaryFlag(lt) ? 'prelim' : (lt.result || '').toLowerCase();
      if (code !== f.res) return false;

    return true;

function submitRegistration(form, next) {
  clearInvalid(form);
  const d = formData(form);
  let ok = true;
  const bad = (n, m) => { setInvalid(form, n, m); ok = false; };
  if (!d.name || d.name.split(/\s+/).length < 2) bad('name');
  if (!d.sex) bad('sex');
  const dobTs = d.dob ? new Date(d.dob).getTime() : null;
  if (dobTs && dobTs > Date.now()) bad('age', 'Date of birth cannot be in the future.');
  if (!dobTs && (d.age === '' || isNaN(+d.age) || +d.age < 0 || +d.age > 120)) bad('age');
  if (!/^[A-Za-z0-9-]{5,20}$/.test(d.docNumber || '')) bad('docNumber');
  if ((d.phone || '').replace(/\D/g, '').length < 7 || /[^\d\s+()-]/.test(d.phone)) bad('phone');
  const td = parseLocalDT(d.travelDate);
  if (!td || td < addDays(sod(Date.now()), -30) || td > addDays(Date.now(), 2)) bad('travelDate');
  if (!d.originCountry) bad('originCountry');
  if (!d.destination || d.destination.length < 2) bad('destination');
  if (d.direction === 'Entry' && (d.stayAddress || '').length < 3) bad('stayAddress');
  if (!d.travelHistory) bad('travelHistory');
  if (d.travelHistory === 'Yes' && (d.travelCountries || '').length < 3) bad('travelCountries');
  if (!ok) { focusFirstInvalid(form); toast('Some required details are missing', 'Fields needing attention are highlighted in red.'); return; }
  const dup = DB.travelers.find(t => t.docNumber === d.docNumber.toUpperCase() && sod(t.regAt) === sod(Date.now()));
  const save = () => {
    const transportRef = mergeTransportRef(d, d.station);
    const { traveler } = addTraveler({
      name: d.name.replace(/\s+/g, ' '), sex: d.sex, dob: dobTs, age: dobTs ? null : +d.age, nationality: d.nationality,
      docType: d.docType, docNumber: d.docNumber.toUpperCase(), phone: d.phone.trim(), originCountry: d.originCountry, destination: d.destination,
      travelDate: td, station: d.station, direction: d.direction, transport: d.transport, transportRef,
      stayAddress: d.stayAddress || '', travelHistory: d.travelHistory, travelCountries: d.travelHistory === 'Yes' ? d.travelCountries : '',
    });
    UI.registerStation = d.station;
    toast('Traveler registered', `${traveler.ref} — dashboard updated.`);
    if (next === 'screen') go('screening', { ref: traveler.ref });
    else go('register', { done: traveler.ref });
  };
  if (dup) askConfirm({ title: 'Possible duplicate', body: `A traveler with document ${h(d.docNumber.toUpperCase())} was already registered today (${h(dup.ref)}). Register again?`, yes: 'Register again' }, save);
  else save();
}

const PER_PAGE = 20;
function filteredTravelers() {
  const f = UI.records, q = f.q.trim().toLowerCase();
  const start = f.period === 'all' ? 0 : periodStart(f.period);
  let list = DB.travelers.filter(t => {
    if (t.regAt < start) return false;
    if (f.station !== 'all' && t.station !== f.station) return false;
    if (q && !(t.name.toLowerCase().includes(q) || t.ref.toLowerCase().includes(q) || (t.docNumber || '').toLowerCase().includes(q))) return false;
    if (f.scr !== 'all' && screeningStatus(t.ref).code !== f.scr) return false;
    const lt = latestTest(t.ref);
    if (f.lab !== 'all') {
      const c = lt ? labCategory(lt) : 'none';
      if (f.lab !== c) return false;
    }
    if (f.res !== 'all') {
      if (!lt) return false;
      const code = isUnfinished(lt) ? 'pending' : isConfirmedPositive(lt) ? 'confirmed' : isPreliminaryFlag(lt) ? 'prelim' : (lt.result || '').toLowerCase();
      if (code !== f.res) return false;
    }
    return true;
  });
  const dir = f.dir;
  const key = { regAt: t => t.regAt, name: t => t.name.toLowerCase(), station: t => stationName(t.station), nationality: t => t.nationality }[f.sort] || (t => t.regAt);
  list.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * dir);
  return list;
}

function travelerTimeline(t) {
  const ev = [{ at: t.regAt, ico: 'userPlus', tone: '', title: 'Registered', body: `${t.direction} at ${stationName(t.station)} by ${t.regBy}` }];
  (IDX.scrBy.get(t.ref) || []).forEach(s => ev.push({ at: s.at, ico: 'stethoscope', tone: s.outcome === 'referred' ? 'crit' : s.outcome === 'clear' ? '' : 'warn', title: `Health screening — ${OUTCOMES[s.outcome].short}`, body: `${s.id} · ${s.temp ? s.temp.toFixed(1) + ' °C' : 'temperature not recorded'} · ${s.officer}` }));
  (IDX.testsBy.get(t.ref) || []).forEach(x => {
    ev.push({ at: x.requestedAt, ico: 'flask', tone: '', title: `${x.testName} requested`, body: `${x.id} · ${x.lab}` });
    if (x.collectedAt) ev.push({ at: x.collectedAt, ico: 'flask', tone: '', title: 'Specimen collected', body: `${x.specimenType} · ${x.specimenRef}` });
    if (x.resultAt) ev.push({ at: x.resultAt, ico: 'check', tone: isConfirmedPositive(x) ? 'crit' : isPreliminaryFlag(x) ? 'warn' : '', title: `Result: ${resultDisplay(x).text}`, body: `${x.id} · ${x.labOfficer}` });
  });

// WHO Ebola suspected-case logic: fever + exposure, fever + 3 symptoms, or unexplained bleeding
function suggestOutcome(form) {
  const temp = parseFloat(form.temp.value);
  const sym = [...form.querySelectorAll('[name=symptoms]:checked')].map(x => x.value).filter(x => !/^Fever/.test(x));
  const fever = temp >= 38 || !!form.querySelector('[name=symptoms][value^="Fever"]:checked');
  const exposures = SCREEN_QUESTIONS.filter(q => form.querySelector(`[name=${q.id}]:checked`)?.value === 'Yes').length;
  const bleeding = sym.some(s => DANGER_SYMPTOMS.includes(s));
  if (isNaN(temp) && !sym.length && !exposures && !fever) return null;
  if (bleeding) return { k: 'referred', why: 'unexplained bleeding is a WHO danger sign' };
  if (fever && exposures) return { k: 'referred', why: 'fever with a possible exposure in the last 21 days' };
  if (fever && sym.length >= 3) return { k: 'referred', why: 'fever with three or more listed symptoms' };
  if (fever || exposures || sym.length || temp >= 37.5) return { k: 'assess', why: fever ? 'fever without exposure' : exposures ? 'possible exposure — rapid test and 21-day follow-up' : temp >= 37.5 ? `temperature ${temp.toFixed(1)} °C` : 'symptoms reported' };
  return { k: 'clear', why: 'no fever, symptoms or exposure' };
}

function validateLab(form, d, t, test) {

  if (form.collectedAt && !['Requested', 'Cancelled'].includes(status)) {

}
function rMeta(items) { return `<dl class="r-meta">${items.map(([k, v]) => `<div><dt>${h(k)}</dt><dd>${v}</dd></div>`).join('')}</dl>`; }
function rStats(items) { return `<div class="r-stats">${items.map(([v, l]) => `<div><b>${v}</b><span>${h(l)}</span></div>`).join('')}</div>`; }
function rTable(head, rows, numCols = []) {
  const shown = rows.slice(0, MAX_ROWS);
  return `<div class="r-scroll"><table class="r-table"><thead><tr>${head.map((x, i) => `<th class="${numCols.includes(i) ? 'num' : ''}">${h(x)}</th>`).join('')}</tr></thead><tbody>${shown.length ? shown.map(r => `<tr>${r.map((c, i) => `<td class="${numCols.includes(i) ? 'num' : ''}">${c}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${head.length}" style="text-align:center;color:#777">No records in this period.</td></tr>`}</tbody></table></div>${rows.length > MAX_ROWS ? `<div class="r-truncated">Showing the first ${MAX_ROWS} of ${n0(rows.length)} rows. Export CSV for the complete list.</div>` : ''}`;
}
function txt(s) { return String(s).replace(/<[^>]+>/g, ''); }

function buildReport(p) {
  const now = Date.now();
  const stLabel = p.station === 'all' ? 'All border stations' : stationName(p.station);
  const prepared = `${CURRENT_USER.name}, ${CURRENT_USER.role}`;
  let title, ref, meta, body, csv, qrLines;

  if (p.type === 'registration' || p.type === 'screening' || p.type === 'lab') {
    const m = computeMetrics(p.period, p.station, now);
    if (p.type === 'registration') {
      title = 'Traveler registration report';
      const list = m.travelers.slice().sort((a, b) => b.regAt - a.regAt);
      const entries = list.filter(t => t.direction === 'Entry').length;
      const nats = new Set(list.map(t => t.nationality)).size;
      const rows = list.map((t, i) => [`<span class="mono">${h(t.ref)}</span>`, h(t.name), `${t.sex}/${travelerAge(t)}`, h(t.nationality), `<span class="mono">${h(t.docNumber)}</span>`, h(stationName(t.station)), t.direction, fmtSDT(t.regAt), h(screeningStatus(t.ref).text)]);
      body = `<div class="r-section">Summary</div>${rStats([[n0(list.length), 'Travelers registered'], [n0(entries), 'Entries'], [n0(list.length - entries), 'Exits'], [nats, 'Nationalities']])}
        <div class="r-section">Registered travelers</div>${rTable(['Reference', 'Name', 'Sex/Age', 'Nationality', 'Document no.', 'Station', 'Direction', 'Registered', 'Screening'], rows)}`;
      csv = [['Reference', 'Name', 'Sex', 'Age', 'Nationality', 'Document type', 'Document number', 'Station', 'Direction', 'Registered', 'Transport', 'Origin', 'Destination', 'Screening status'], ...list.map(t => [t.ref, t.name, t.sex, travelerAge(t), t.nationality, t.docType, t.docNumber, stationName(t.station), t.direction, fmtDT(t.regAt), t.transport, t.originCountry, t.destination, screeningStatus(t.ref).text])];
      meta = list.length;
    } else if (p.type === 'screening') {
      title = 'Health screening report';
      const list = m.screenings.slice().sort((a, b) => b.at - a.at);
      const rows = list.map(s => { const t = IDX.byRef.get(s.travelerRef); return [`<span class="mono">${h(s.id)}</span>`, `${h(t ? t.name : '')}<br><span class="mono">${h(s.travelerRef)}</span>`, h(stationName(s.station)), fmtSDT(s.at), s.temp ? s.temp.toFixed(1) + ' °C' : '—', h(s.symptoms.join(', ') || 'None'), h(OUTCOMES[s.outcome].short), s.outcome === 'referred' ? h(s.referralStatus.replace('Referred — ', '')) : '—', h(s.officer)]; });
      body = `<div class="r-section">Summary</div>${rStats([[n0(list.length), 'Screenings recorded'], [n0(m.outcomes.clear), 'No immediate concern'], [n0(m.outcomes.assess), 'Further assessment'], [n0(m.outcomes.referred), 'Referred for clinical evaluation'], [n0(m.outcomes.incomplete), 'Incomplete'], [m.travelers.length ? m.coverage.toFixed(1) + '%' : '—', 'Screening coverage'], [n0(m.notScreened.length), 'Registered, not yet screened'], [`${SCREENING_TARGET}%`, 'Coverage target']])}
        <div class="r-section">Screening records</div>${rTable(['Screening', 'Traveler', 'Station', 'Date and time', 'Temp.', 'Symptoms', 'Outcome', 'Referral', 'Officer'], rows)}`;
      csv = [['Screening ref', 'Registration ref', 'Traveler', 'Station', 'Date and time', 'Temperature C', 'Symptoms', 'Outcome', 'Referral status', 'Referral facility', 'Officer', 'Notes'], ...list.map(s => { const t = IDX.byRef.get(s.travelerRef); return [s.id, s.travelerRef, t ? t.name : '', stationName(s.station), fmtDT(s.at), s.temp ?? '', s.symptoms.join('; '), OUTCOMES[s.outcome].label, s.referralStatus, s.referralFacility, s.officer, s.notes]; })];
      meta = list.length;
    } else {
      title = 'Laboratory test result report';
      let list = m.tests.slice().sort((a, b) => b.requestedAt - a.requestedAt);

      if (rf === 'confirmed') list = list.filter(isConfirmedPositive);
      if (rf === 'prelim') list = list.filter(isPreliminaryFlag);
      if (rf === 'pending') list = list.filter(isUnfinished);
      if (rf === 'negative') list = list.filter(t => t.status === 'Completed' && t.result === 'Negative');

      const rows = list.map(x => { const t = IDX.byRef.get(x.travelerRef); return [`<span class="mono">${h(x.id)}</span>`, `${h(t ? t.name : '')}<br><span class="mono">${h(x.travelerRef)}</span>`, h(stationName(x.station)), `${h(x.testName)}<br><span style="color:#666">${h(x.specimenType)}</span>`, x.collectedAt ? fmtSDT(x.collectedAt) : 'Not collected', h(x.status) + (isOverdue(x) ? ' (overdue)' : ''), `<b>${h(resultDisplay(x).text)}</b>`, x.resultAt ? fmtSDT(x.resultAt) : '—', h(shortLab(x.lab))]; });
      body = `<div class="r-section">Summary — tests requested in the period</div>${rStats([[n0(all.length), 'Tests requested'], [n0(m.cat.completed), 'Completed'], [n0(m.pendingAll), `Awaiting result (${m.cat.overdue} overdue)`], [n0(m.cat.invalid), 'Invalid'], [n0(all.filter(isConfirmedPositive).length), 'Confirmed positive'], [n0(all.filter(isPreliminaryFlag).length), 'Preliminary flags'], [n0(all.filter(t => t.status === 'Completed' && t.result === 'Negative').length), 'Negative'], [n0(m.cat.cancelled), 'Cancelled']])}
        <p style="font-size:11px;color:#555;margin:8px 0 0">Confirmed = positive confirmatory test (RT-PCR) (WHO reference method). Preliminary = positive rapid test or inconclusive result awaiting RT-PCR confirmation. Pending results are not negative.</p>
        <div class="r-section">Test records${rf !== 'all' ? ` — filtered: ${h({ confirmed: 'confirmed positive', prelim: 'preliminary flags', pending: 'awaiting result', negative: 'negative' }[rf])}` : ''}</div>${rTable(['Test', 'Traveler', 'Station', 'Test / specimen', 'Collected', 'Status', 'Result', 'Result date', 'Laboratory'], rows)}`;
      csv = [['Test ref', 'Registration ref', 'Traveler', 'Station', 'Test', 'Specimen type', 'Specimen ref', 'Collected', 'Status', 'Overdue', 'Result', 'Classification', 'Result date', 'Laboratory', 'Officer'], ...list.map(x => { const t = IDX.byRef.get(x.travelerRef); return [x.id, x.travelerRef, t ? t.name : '', stationName(x.station), x.testName, x.specimenType, x.specimenRef, x.collectedAt ? fmtDT(x.collectedAt) : '', x.status, isOverdue(x) ? 'Yes' : 'No', x.result || '', resultDisplay(x).text, x.resultAt ? fmtDT(x.resultAt) : '', x.lab, x.labOfficer]; })];

  if (p.type === 'daily') {

    const day0 = p.date ? sod(new Date(p.date + 'T00:00').getTime()) : sod(now), day1 = addDays(day0, 1);

    qrLines = [`Station: ${stationName(station)}`, `Date: ${fmtDate(day0)}`, `Travelers: ${trav.length}`];
    meta = rMeta([['Report reference', `<span class="mono">${ref}</span>`], ['Date', fmtDate(day0) + (sod(now) === day0 ? ' (so far)' : '')], ['Border station', h(stationName(station))], ['Station type', h(stationOf(station)?.type || '')], ['Generated', fmtDT(now)], ['Prepared by', h(prepared)], ['Region', h(stationOf(station)?.region || '')], ['Classification', 'Internal — public health']]);
    const flagged = DB.travelers.filter(t => t.station === station).filter(t => (IDX.alertsBy.get(t.ref) || []).some(a => inD(a.createdAt)));
    body = `<div class="r-section">Daily figures</div>${rStats([[n0(trav.length), `Travelers (${entries} in / ${trav.length - entries} out)`], [trav.length ? pct(ok, trav.length) : '—', 'Screening coverage'], [n0(tests.length), 'Laboratory tests requested'], [n0(reported.length), 'Results reported'], [n0(reported.filter(isConfirmedPositive).length), 'Confirmed positive'], [n0(reported.filter(isPreliminaryFlag).length), 'Preliminary flags'], [n0(alerts.length), 'Alerts raised'], [n0(alerts.filter(a => a.status !== 'Resolved').length), 'Alerts still active']])}
      <div class="r-section">Screening outcomes</div>${rTable(['Outcome', 'Count', 'Share'], Object.keys(OUTCOMES).map(k => [h(OUTCOMES[k].label), o[k], scr.length ? pct(o[k], scr.length) : '—']).concat([['<b>Total screenings</b>', `<b>${scr.length}</b>`, ''], ['Registered but not screened', trav.filter(t => !latestScreening(t.ref)).length, '']]), [1, 2])}
      <div class="r-section">Laboratory results reported</div>${rTable(['Test', 'Registration ref', 'Test type', 'Status', 'Result', 'Reported'], reported.map(x => [`<span class="mono">${x.id}</span>`, `<span class="mono">${x.travelerRef}</span>`, h(x.testName), h(x.status), `<b>${h(resultDisplay(x).text)}</b>`, fmtTime(x.resultAt)]))}
      <div class="r-section">Alerts raised</div>${rTable(['Alert', 'Priority', 'Category', 'Registration ref', 'Raised', 'Status'], alerts.map(a => [`<span class="mono">${a.id}</span>`, PRIORITY_LABEL[a.priority], h(ALERT_CATS[a.category].short), `<span class="mono">${a.travelerRef}</span>`, fmtTime(a.createdAt), h(a.status)]))}
      <div class="r-section">Officers on duty</div><p style="margin:4px 0">${h((stationOf(station)?.officers || []).join(', '))}</p>
      <div class="r-sign"><div>Station focal point — name and signature</div><div>Reviewed by (Regional Health Office)</div></div>`;
    csv = [['Daily station summary', stationName(station), fmtDate(day0)], ['Travelers', trav.length], ['Entries', entries], ['Exits', trav.length - entries], ['Completed screenings', ok], ['Coverage', trav.length ? pct(ok, trav.length) : ''], ['Tests requested', tests.length], ['Results reported', reported.length], ['Confirmed positive', reported.filter(isConfirmedPositive).length], ['Preliminary flags', reported.filter(isPreliminaryFlag).length], ['Alerts raised', alerts.length], [], ['Registration ref', 'Name', 'Direction', 'Registered', 'Screening status'], ...trav.map(t => [t.ref, t.name, t.direction, fmtDT(t.regAt), screeningStatus(t.ref).text])];
    void flagged;
  }

  if (p.type === 'national') {
    const m = computeMetrics(p.period, 'all', now);
    const sb = stationBreakdown(p.period, now);
    const span = Math.round((sod(now) - m.start) / DAY) + 1;
    const prevStart = addDays(m.start, -span);

    obs.push(`National screening coverage is ${m.coverage.toFixed(1)}% against a ${SCREENING_TARGET}% target${below.length ? `; below target: ${below.map(x => `${x.station.name} (${x.m.coverage.toFixed(1)}%)`).join(', ')}` : '; all stations meet the target'}.`);
    obs.push(`${m.confirmed.length} confirmed positive and ${m.prelim.length} preliminary results were reported; preliminary results require confirmatory testing and are not counted as cases.`);

    obs.push(`${m.urgentOpen} urgent alert${m.urgentOpen === 1 ? '' : 's'} and ${m.active.length} alerts in total remain open.`);
    title = 'National border health surveillance summary';

    meta = rMeta([['Report reference', `<span class="mono">${ref}</span>`], ['Reporting period', h(periodLabel(p.period))], ['Coverage', `${DB.stations.length} border stations`], ['Generated', fmtDT(now)], ['Prepared by', h(prepared)], ['Distribution', 'Ministry directors'], ['Data source', 'SHIS'], ['Classification', 'Internal — public health']]);

      <div class="r-section">Observations</div><ul style="margin:4px 0;padding-left:18px;line-height:1.6">${obs.map(o => `<li>${h(o)}</li>`).join('')}</ul>

      <p style="font-size:10.5px;color:#666;margin:4px 0 0">▲ below the ${SCREENING_TARGET}% screening coverage target.</p>
      <div class="r-section">Alerts by category</div>${rTable(['Category', 'Priority', 'Raised', 'Active', 'Resolved'], byCat, [2, 3, 4])}
      <div class="r-section">Laboratory testing by test type</div>${rTable(['Test type', 'Requested', 'Completed', 'Awaiting result', 'Confirmed +', 'Preliminary'], byType, [1, 2, 3, 4, 5])}
      <div class="r-sign"><div>Prepared by — National Surveillance Unit</div><div>Approved by — Director, Public Health</div></div>`;
    csv = [['National surveillance summary', periodLabel(p.period)], ['Travelers registered', m.travelers.length], ['Screenings completed', m.screenedOk.length], ['Screening coverage %', m.coverage.toFixed(1)], ['Tests requested', m.tests.length], ['Confirmed positive', m.confirmed.length], ['Preliminary flags', m.prelim.length], ['Pending lab results', m.pendingAll], ['Overdue', m.cat.overdue], ['Urgent open alerts', m.urgentOpen], [], ['Station', 'Travelers', 'Screened', 'Coverage %', 'Tests', 'Pending', 'Confirmed', 'Preliminary', 'Active alerts'], ...sb.map(({ station: s, m: x }) => [s.name, x.travelers.length, x.screenedOk.length, x.coverage.toFixed(1), x.tests.length, x.pendingAll, x.confirmed.length, x.prelim.length, x.active.length])];
  }

        <tr><th>Direction</th><td>${t.direction} — ${fmtDT(t.travelDate)}</td><th>Transport</th><td>${h(t.transport)}${t.transportRef ? ' · ' + h(t.transportRef) : ''}</td></tr>
        <tr><th>Country of origin</th><td>${h(t.originCountry)}</td><th>Destination</th><td>${h(t.destination)}</td></tr>
        <tr><th>Staying at (address)</th><td>${h(t.stayAddress || 'Not recorded')}</td><th>Travel history (6 months)</th><td>${travelHistoryHTML(t)}</td></tr>
      </tbody></table></div>
      <div class="r-section">Health screening</div>${rTable(['Reference', 'Date and time', 'Temp.', 'Symptoms', 'Outcome', 'Referral', 'Officer'], scr.map(s => [`<span class="mono">${s.id}</span>`, fmtSDT(s.at), s.temp ? s.temp.toFixed(1) + ' °C' : '—', h(s.symptoms.join(', ') || 'None'), h(OUTCOMES[s.outcome].label), s.outcome === 'referred' ? h(s.referralStatus) : '—', h(s.officer)]))}

      ${(IDX.vaxBy.get(t.ref) || []).length ? `<div class="r-section">Vaccination</div>${rTable(['Vaccine', 'Status', 'Date', 'Officer'], (IDX.vaxBy.get(t.ref) || []).map(v => [h(vaccineName(v.vaccineId)), h(v.status), fmtSDT(v.at), h(v.officer || '')]))}` : ''}

      <p style="font-size:11px;color:#555;margin-top:14px">This record summarises border health screening and testing. It is not a travel health certificate.</p>
      <div class="r-sign"><div>Issuing officer — name and signature</div><div>Station stamp</div></div>`;
    csv = [['Field', 'Value'], ['Registration ref', t.ref], ['Name', t.name], ['Sex', t.sex], ['Age', travelerAge(t)], ['Nationality', t.nationality], ['Document', `${t.docType} ${t.docNumber}`], ['Station', stationName(t.station)], ['Direction', t.direction], ['Registered', fmtDT(t.regAt)], [], ['Screening ref', 'Date', 'Temperature', 'Outcome', 'Referral'], ...scr.map(s => [s.id, fmtDT(s.at), s.temp ?? '', OUTCOMES[s.outcome].label, s.referralStatus]), [], ['Test ref', 'Test', 'Status', 'Result', 'Result date'], ...tests.map(x => [x.id, x.testName, x.status, resultDisplay(x).text, x.resultAt ? fmtDT(x.resultAt) : ''])];
    return { title, ref, meta, body, csv, qr: travelerQRPayload(t) + `\nReport: ${ref}` };
  }
  return { title, ref, meta, body, csv, qr: reportQR(title, ref, qrLines) };
}
function shortLab(l) { return String(l).replace('Central Public Health Laboratory — Hargeisa', 'Central PHL, Hargeisa').replace(' Regional Hospital Laboratory', ' Regional Hospital Lab'); }
function period_is_partial(period) { return period === 'today'; }

PAGES.reports = {
  title: 'Results and Reports',

    if (params.get('ref')) p.ref = params.get('ref');
