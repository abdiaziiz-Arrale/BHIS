    if (!p.date) p.date = isoDate(Date.now());
    const def = REPORT_TYPES.find(r => r.id === p.type) || REPORT_TYPES[0];
    const rep = buildReport(p);
    const showPeriod = ['registration', 'screening', 'lab', 'national'].includes(p.type);
    const showStation = ['registration', 'screening', 'lab', 'daily'].includes(p.type);
    return `
    <div class="page-intro"><div><h2>Results and reports</h2><p>Printable reports with the ministry header, report reference and QR verification. Use your browser’s print dialog to save as PDF.</p></div></div>
    <div class="grid report-print-root">
      <aside class="stack">
        <div class="card"><div class="card-h"><div><h3>Report type</h3></div></div><div class="card-b"><div class="f report-select"><label>Report type</label><select class="select" data-change="rpt-type-sel">${options(REPORT_TYPES.map(r => ({ value: r.id, label: r.title })), p.type)}</select></div><div class="report-types">
          ${REPORT_TYPES.map(r => `<button class="report-type ${r.id === p.type ? 'on' : ''}" data-act="rpt-type" data-v="${r.id}">${icon(r.ico)}<div><strong>${h(r.title)}</strong><span>${h(r.desc)}</span></div></button>`).join('')}
        </div></div></div>
        <div class="card"><div class="card-h"><div><h3>Parameters</h3></div></div><div class="card-b"><div class="fields">
          ${showPeriod ? field('Reporting period', `<select class="select" data-change="rpt-p" data-k="period">${options(Object.entries(PERIODS).map(([v, l]) => ({ value: v, label: l })), p.period)}</select>`, { span: 12 }) : ''}
          ${p.type === 'daily' ? field('Date', `<input class="input" type="date" value="${p.date}" min="${isoDate(periodStart('30d'))}" max="${isoDate(Date.now())}" data-change="rpt-p" data-k="date">`, { span: 12 }) : ''}
          ${showStation ? field('Border station', `<select class="select" data-change="rpt-p" data-k="station">${p.type === 'daily' ? stationOptions(p.station === 'all' ? DB.stations[0].code : p.station, false) : stationOptions(p.station)}</select>`, { span: 12 }) : ''}
          ${p.type === 'lab' ? field('Results to include', `<select class="select" data-change="rpt-p" data-k="result">${options([{ value: 'all', label: 'All tests' }, { value: 'confirmed', label: 'Confirmed positive only' }, { value: 'prelim', label: 'Preliminary flags only' }, { value: 'pending', label: 'Awaiting result only' }, { value: 'negative', label: 'Negative only' }], p.result)}</select>`, { span: 12 }) : ''}
          ${p.type === 'traveler' ? field('Traveler', comboHTML('rpt-trav', p.ref, 'Search traveler'), { span: 12 }) : ''}
        </div></div></div>
      </aside>
      <div class="paper-col stack" style="gap:12px">
        <div class="row"><strong style="font-size:15px">${h(def.title)}</strong><span class="spacer"></span>${rep ? `<button class="btn" data-act="rpt-csv">${icon('download')}Export CSV</button><button class="btn primary" data-act="rpt-print">${icon('printer')}Print / Save as PDF</button>` : ''}</div>
        <div class="paper-wrap">${rep ? `<article class="paper" id="report-paper">
          ${reportHeaderHTML(rep.title, rep.ref, rep.qr)}${rep.meta}${rep.body}
        </article>` : `<div class="paper">${empty('Select a traveler', 'Search for a traveler in Parameters to generate the individual record.')}</div>`}</div>
      </div>
    </div>`;
  },
  mount(params) {
    if (UI.reports.type === 'traveler') mountCombo('rpt-trav', t => { UI.reports.ref = t.ref; go('reports', { type: 'traveler', ref: t.ref }); });
    if (params.get('print') === '1') { replaceHash(currentHash().replace(/[?&]print=1/, '')); setTimeout(printReport, 350); }
  },
};
ACT['rpt-type'] = el => { UI.reports.type = el.dataset.v; go('reports', UI.reports.type === 'traveler' && UI.reports.ref ? { type: 'traveler', ref: UI.reports.ref } : { type: el.dataset.v }); };
ACT['rpt-type-sel'] = el => ACT['rpt-type']({ dataset: { v: el.value } });
ACT['rpt-p'] = el => { UI.reports[el.dataset.k] = el.value; go('reports', { type: UI.reports.type }); };
ACT['rpt-print'] = () => printReport();
ACT['rpt-csv'] = () => {
  const rep = buildReport(UI.reports); if (!rep) return;
  downloadCSV(`SHIS-${UI.reports.type}-${rep.ref}.csv`, [[rep.title, rep.ref, `Generated ${fmtDT(Date.now())}`], [], ...rep.csv.map(r => r.map(c => typeof c === 'string' ? txt(c) : c))]);
  toast('CSV exported', `${rep.title} (${rep.ref}).`);
};

/* ============================================================
   Border Stations
   ============================================================ */
const STATION_ICON = { 'Airport': 'plane', 'Seaport': 'ship', 'Land border': 'truck' };
PAGES.stations = {
  title: 'Border Stations',
  render(params) {
    const f = UI.stations;
    if (params.get('station') && IDX.stByCode.get(params.get('station'))) f.selected = params.get('station');
    if (!IDX.stByCode.get(f.selected)) f.selected = DB.stations[0].code;
    const sb = stationBreakdown(f.period);
    const sel = sb.find(x => x.station.code === f.selected);
    const s = sel.station, m = sel.m;
    const low = m.travelers.length && m.coverage < SCREENING_TARGET;
    const activeAlerts = DB.alerts.filter(a => a.station === s.code && a.status !== 'Resolved').sort((a, b) => ({ urgent: 0, high: 1, routine: 2 }[a.priority] - { urgent: 0, high: 1, routine: 2 }[b.priority]) || b.createdAt - a.createdAt);
    const backlog = DB.tests.filter(t => t.station === s.code && isUnfinished(t));
    return `
    <div class="page-intro"><div><h2>Border stations</h2><p>Operational summary for each point of entry. Select a station to see its travelers, screening completion, laboratory workload and alerts.</p></div>
      <div class="row">${seg('st-period', f.period, [['today', 'Today'], ['7d', 'Last 7 days'], ['30d', 'Last 30 days']])}<button class="btn" data-act="st-add">${icon('plus')}Add station</button></div></div>
    <div style="margin-bottom:18px">${labMapHTML(f.period, f.selected)}</div>
    <div class="station-cards" style="margin-bottom:18px">
      ${sb.map(({ station: st, m: sm }) => { const lowS = sm.travelers.length && sm.coverage < SCREENING_TARGET; const needs = lowS || sm.urgentOpen || sm.cat.overdue; return `<button class="station-card ${st.code === f.selected ? 'on' : ''}" data-act="st-select" data-v="${st.code}">
        <div class="sc-h"><span class="sc-ico">${icon(STATION_ICON[st.type] || 'mapPin')}</span><div style="min-width:0"><strong>${h(st.name)}</strong><span class="sc-type">${h(st.type)} · ${h(st.code)}${st.custom ? ' · added' : ''}</span></div></div>
        <div class="sc-stats"><div><b>${n0(sm.travelers.length)}</b>travelers</div><div><b>${sm.travelers.length ? sm.coverage.toFixed(1) + '%' : '—'}</b>screened</div><div><b>${sm.active.length}</b>alerts</div></div>
        <div>${sm.travelers.length === 0 && st.custom ? badge('No activity yet', 'neutral') : needs ? badge('Needs attention', 'crit') : badge('On track', 'good')}</div></button>`; }).join('')}
    </div>
    <div class="card" style="margin-bottom:16px"><div class="card-b station-head" style="display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap">
      <span class="sc-ico" style="width:46px;height:46px;border-radius:10px;background:var(--green-100);color:var(--green-700);display:grid;place-items:center">${icon(STATION_ICON[s.type] || 'mapPin')}</span>
      <div style="flex:1;min-width:220px"><h3 style="font-size:19px">${h(s.name)}</h3><div class="muted">${h(s.type)} · ${h(s.region)} region · station code ${h(s.code)} · ${h(periodLabel(f.period))}</div></div>
      <button class="btn" data-act="st-dash" data-v="${s.code}">${icon('dashboard')}Show on dashboard</button>
      <button class="btn" data-act="go" data-page="reports" data-params='${JSON.stringify({ type: 'daily', station: s.code })}'>${icon('fileText')}Daily station summary</button>
      <button class="btn primary" data-act="go" data-page="register" data-params='${JSON.stringify({ station: s.code })}'>${icon('userPlus')}Register traveler here</button>
    </div></div>
    <div class="kpis" style="margin-bottom:16px">
      ${kpi({ label: 'Travelers', value: n0(m.travelers.length), sub: `${m.travelers.filter(t => t.direction === 'Entry').length} entries · ${m.travelers.filter(t => t.direction === 'Exit').length} exits`, tone: 'green', ico: 'users' })}
      ${kpi({ label: 'Screening completion', value: m.travelers.length ? m.coverage.toFixed(1) : '—', unit: m.travelers.length ? '%' : '', meter: m.coverage, sub: low ? `Below ${SCREENING_TARGET}% target` : `Target ${SCREENING_TARGET}%`, tone: low ? 'warn' : 'green', ico: 'stethoscope' })}
      ${kpi({ label: 'Laboratory tests', value: n0(m.tests.length), sub: `${m.cat.completed} completed in period`, tone: 'info', ico: 'flask' })}
      ${kpi({ label: 'Laboratory workload now', value: backlog.length, sub: `${backlog.filter(t => isOverdue(t)).length} overdue · awaiting result`, tone: 'warn', ico: 'clock' })}
      ${kpi({ label: 'Confirmed positive', value: m.confirmed.length, sub: `${m.prelim.length} preliminary flags`, tone: 'crit', ico: 'alert' })}
      ${kpi({ label: 'Active alerts', value: activeAlerts.length, sub: `${activeAlerts.filter(a => a.priority === 'urgent').length} urgent · all dates`, tone: 'crit', ico: 'bell' })}
    </div>
    <div class="grid g2" style="margin-bottom:16px">
      <div class="card"><div class="card-h"><div><h3>Travelers registered — last 7 days</h3><p>${h(s.name)}</p></div></div><div class="card-b">
        <div class="legend"><span><i class="line" style="background:${C.green}"></i>Registered</span><span><i class="line" style="background:${C.info}"></i>Screening completed</span></div>
        <div class="chart" id="st-trend"></div></div></div>
      <div class="card"><div class="card-h"><div><h3>Screening and laboratory workload</h3><p>${h(PERIODS[f.period])}</p></div></div><div class="card-b">
        <div class="small" style="margin-bottom:6px;font-weight:600">Screening outcomes (${m.screenings.length} screenings)</div>
        ${stripHTML([{ label: 'No immediate concern', value: m.outcomes.clear, color: C.good }, { label: 'Further assessment', value: m.outcomes.assess, color: C.warn }, { label: 'Referred', value: m.outcomes.referred, color: C.crit }, { label: 'Incomplete', value: m.outcomes.incomplete, color: C.neutral }])}
        <div class="legend" style="margin-top:8px"><span><i style="background:${C.good}"></i>No concern ${m.outcomes.clear}</span><span><i style="background:${C.warn}"></i>Assessment ${m.outcomes.assess}</span><span><i style="background:${C.crit}"></i>Referred ${m.outcomes.referred}</span><span><i style="background:${C.neutral}"></i>Incomplete ${m.outcomes.incomplete}</span><span>Not screened ${m.notScreened.length}</span></div>
        <div class="small" style="margin:14px 0 4px;font-weight:600">Laboratory tests requested in period, by status</div>
        <div class="chart" id="st-lab"></div></div></div>
    </div>
    <div class="grid g-main-side">
      <div class="card"><div class="card-h"><div><h3>Active alerts at this station</h3><p>All dates, most urgent first</p></div><a class="btn sm" href="#/alerts">Open alerts</a></div><div class="table-wrap">${activeAlerts.length ? `<table class="tbl cardify"><thead><tr><th class="c-ref">Alert</th><th>Priority</th><th class="c-primary">Category</th><th>Raised</th><th class="hide-md">Assigned</th><th>Status</th></tr></thead><tbody>${activeAlerts.slice(0, 10).map(a => `<tr class="clickable" data-act="open-alert" data-id="${a.id}"><td class="mono">${a.id}</td><td>${prioTag(a.priority)}</td><td>${h(ALERT_CATS[a.category].short)}</td><td class="small">${relTime(a.createdAt)}</td><td class="small">${officerShort(a.officer)}</td><td>${alertStatusBadge(a.status)}</td></tr>`).join('')}</tbody></table>` : empty('No active alerts', 'Every alert at this station has been resolved.')}</div></div>
      <div class="card"><div class="card-h"><div><h3>Station profile</h3></div></div><div class="card-b">
        <dl class="dl"><div><dt>Type</dt><dd>${h(s.type)}</dd></div><div><dt>Region</dt><dd>${h(s.region)}</dd></div><div><dt>Station code</dt><dd class="mono">${h(s.code)}</dd></div><div><dt>Rapid test unit</dt><dd>${h(s.name)} rapid test unit</dd></div></dl>
        <div class="small" style="margin:14px 0 6px;font-weight:600">Officers on duty</div>
        <ul style="margin:0;padding-left:18px;line-height:1.7;font-size:13px">${(s.officers || []).map(o => `<li>${h(o)}</li>`).join('')}</ul></div></div>
    </div>`;
  },
  mount() {
    const f = UI.stations, s = f.selected;
    const m = computeMetrics(f.period, s);
    const series = dailySeries(7, s);
    mountChart(document.getElementById('st-trend'), el => chartLine(el, {
      label: 'Station seven-day trend', height: 300,
      series: [{ name: 'Travelers registered', short: 'registered', color: C.green }, { name: 'Screening completed', short: 'screened', color: C.info }],
      points: series.map((d, i) => ({ label: i === series.length - 1 ? 'Today' : fmtDayShort(d.day), full: fmtDate(d.day), partial: i === series.length - 1, values: [d.registered, d.screened] })),
    }));
    mountChart(document.getElementById('st-lab'), el => chartHGroups(el, {
      label: 'Station laboratory workload',
      groups: [{ title: 'Awaiting result', rows: [{ label: 'Overdue', value: m.cat.overdue, color: C.crit, emph: true }, { label: 'Pending', value: m.cat.pending, color: C.warn, emph: true }, { label: 'Processing', value: m.cat.processing, color: C.info }] },
        { title: 'Finalised', rows: [{ label: 'Completed', value: m.cat.completed, color: C.good }, { label: 'Invalid', value: m.cat.invalid, color: C.neutral }] }],
    }));
  },
};
ACT['st-period'] = el => { UI.stations.period = el.dataset.v; refresh(); };
ACT['st-select'] = el => { UI.stations.selected = el.dataset.v; go('stations', { station: el.dataset.v }); };
ACT['st-dash'] = el => { UI.dash.station = el.dataset.v; UI.dash.period = UI.stations.period; go('dashboard'); };
ACT['st-add'] = () => {
  openModal({
    title: 'Add a border station',
    sub: 'Configure an additional point of entry. It becomes available in registration, filters and reports.',
    body: `<form id="st-form" novalidate><div class="fields">
      ${field('Station name', `<input class="input" name="name" maxlength="50" placeholder="e.g. Burao Airport">`, { req: true, span: 8, err: 'Enter a station name that is not already used.' })}
      ${field('Station code', `<input class="input mono" name="code" maxlength="3" placeholder="BUR" style="text-transform:uppercase">`, { req: true, span: 4, err: '3 letters, not already used.' })}
      ${field('Station type', `<select class="select" name="type">${options(['Airport', 'Seaport', 'Land border'], 'Airport')}</select>`, { req: true, span: 6 })}
      ${field('Region', `<input class="input" name="region" maxlength="40" placeholder="e.g. Togdheer">`, { req: true, span: 6 })}
      ${field('City / town', `<input class="input" name="city" maxlength="40" placeholder="e.g. Burao">`, { span: 6 })}
      ${field('Officers (comma-separated)', `<input class="input" name="officers" placeholder="Optional">`, { span: 6 })}
    </div></form>`,
    foot: `<button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="st-save">${icon('check')}Add station</button>`,
  });
};
ACT['st-save'] = () => {
  const form = document.getElementById('st-form'); clearInvalid(form);
  const d = formData(form); let ok = true;
  const code = (d.code || '').toUpperCase();
  if (!d.name || DB.stations.some(s => s.name.toLowerCase() === d.name.toLowerCase())) { setInvalid(form, 'name'); ok = false; }
  if (!/^[A-Z]{3}$/.test(code) || DB.stations.some(s => s.code === code)) { setInvalid(form, 'code'); ok = false; }
  if (!d.region) { setInvalid(form, 'region'); ok = false; }
  if (!ok) return;
  const st = addStation({ code, name: d.name, type: d.type, region: d.region, city: d.city || d.name.split(' ')[0], officers: (d.officers || '').split(',').map(x => x.trim()).filter(Boolean) });
  closeModal(); toast(`${st.name} added`, 'Available in registration, dashboard filters and reports.');
  UI.stations.selected = st.code; go('stations', { station: st.code });
};

/* ============================================================
   Settings — tests and vaccines catalogue, logo, sample data
   ============================================================ */

      <div class="grid g2">
        <div class="card"><div class="card-h"><div><h3>Laboratory tests</h3><p>${activeTests().length} in use</p></div></div>
          <div class="cat-list">${DB.catalog.tests.map(t => `<div class="cat-row ${t.active === false ? 'off' : ''}"><div><strong>${h(t.label)}</strong><span>${h(t.resultType === 'num' ? 'Numeric result' : kindLabel(t))} · normal: ${h(normalRangeText(t.id))} · ${h(t.specimen)} · result within ${t.limitH} h</span></div><button class="btn sm" data-act="cat-toggle" data-kind="test" data-id="${t.id}">${t.active === false ? 'Switch on' : 'Switch off'}</button></div>`).join('')}</div>

          </div><button type="button" class="btn primary" data-act="cat-add-test" style="margin-top:12px">${icon('plus')}Add test</button></form>
        </div>
        <div class="card"><div class="card-h"><div><h3>Vaccinations</h3><p>${activeVaccines().length} in use</p></div></div>
          <div class="cat-list">${DB.catalog.vaccines.map(v => `<div class="cat-row ${v.active === false ? 'off' : ''}"><div><strong>${h(v.name)}</strong><span>${h(v.note || '')}</span></div><button class="btn sm" data-act="cat-toggle" data-kind="vaccine" data-id="${v.id}">${v.active === false ? 'Switch on' : 'Switch off'}</button></div>`).join('')}</div>
          <form class="card-b cat-add" id="add-vax" novalidate><h4>Add a vaccine</h4><div class="fields">
            ${field('Vaccine name', '<input class="input" name="name" placeholder="e.g. Typhoid conjugate vaccine">', { req: true, span: 12, err: 'Enter the vaccine name.' })}
            ${field('Who receives it (optional)', '<input class="input" name="note" placeholder="e.g. Travelers to outbreak areas">', { span: 12 })}
          </div><button type="button" class="btn primary" data-act="cat-add-vax" style="margin-top:12px">${icon('plus')}Add vaccine</button></form>
        </div>
      </div>
      <div class="card" style="margin-top:16px"><div class="card-b row" style="justify-content:space-between">
        <div><strong>Ministry logo, sample data and calculation notes</strong><div class="small muted">Upload the official logo or reset the sample data.</div></div>
        <button class="btn" data-act="open-about">${icon('image')}Logo and data</button></div></div>

ACT['cat-toggle'] = el => { const x = toggleCatalog(el.dataset.kind, el.dataset.id); toast(`${x.label || x.name} switched ${x.active === false ? 'off' : 'on'}`); refresh(); };
ACT['cat-rtype'] = el => { const f = el.closest('form'); const num = el.value === 'num'; f.querySelectorAll('.rt-num').forEach(x => x.classList.toggle('hidden', !num)); f.querySelectorAll('.rt-qual').forEach(x => x.classList.toggle('hidden', num)); };
ACT['cat-add-test'] = () => {
  const form = document.getElementById('add-test'); clearInvalid(form); const d = formData(form);
  if (!d.label) { setInvalid(form, 'label'); return; }
  if (d.resultType === 'num' && d.refLow === '' && d.refHigh === '') { toast('Normal range needed', 'Enter the lowest and/or highest normal value.'); return; }
  const t = addCatalogTest(d); toast('Test added', `${t.label} is now available at screening and in the laboratory.`); refresh();
};
ACT['cat-add-vax'] = () => {
  const form = document.getElementById('add-vax'); clearInvalid(form); const d = formData(form);
  if (!d.name) { setInvalid(form, 'name'); return; }
  const v = addCatalogVaccine(d); toast('Vaccine added', `${v.name} is now available at screening.`); refresh();
};

/* ============================================================
   SHIS demo — start-up
   ============================================================ */
(function start() {
  try {
    loadState();
  } catch (e) {
    console.error('Stored demo data could not be read; regenerating.', e);
    try { localStorage.removeItem(APP.storageKey); } catch (x) { /* ignore */ }
    DB = generateSeed(Date.now()); reindex(); saveState();
  }
  renderShellStatic();
  initGlobal();
  detectRouterMode();
  render();
  // keep "overdue" status and the clock current while the demo is open
  setInterval(() => { const r = syncAlerts(DB); if (r.created.length || r.resolved.length) { reindex(); saveState(); renderSidebar(CURRENT.page); } }, 60000);
})();

</script>
